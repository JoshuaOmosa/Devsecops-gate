name: DevSecOps Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Download OPA
        run: |
          mkdir -p ~/bin
          curl -sL https://openpolicyagent.org/downloads/latest/opa_linux_x86_64 -o ~/bin/opa
          chmod +x ~/bin/opa
          echo "$HOME/bin" >> $GITHUB_PATH
          opa version
      
      - name: Run Security Gate
        id: gate
        run: |
          python3 scripts/process-results.py policies/test_data.json
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          exit 0
      
      - name: Upload Triage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: scan-results/
          retention-days: 30
      
      - name: Comment on PR with Result
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let body = '';
            try {
              const summaryPath = 'scan-results/triage-summary.json';
              if (fs.existsSync(summaryPath)) {
                const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                const blocked = ${{ steps.gate.outputs.exit_code }} === 1;
                const icon = blocked ? '❌' : '✅';
                
                body = `${icon} **DevSecOps Security Gate**\n\n`;
                body += `**Findings:** ${summary.noise_statistics?.total_findings || 0}\n`;
                body += `**Actionable:** ${summary.noise_statistics?.actionable_findings || 0}\n`;
                body += `**Noise Reduction:** ${summary.noise_statistics?.noise_reduction_percentage || 0}%\n\n`;
                
                if (summary.violated_policies?.length > 0) {
                  body += `**Violations:**\n`;
                  summary.violated_policies.forEach(v => {
                    body += `- ${v}\n`;
                  });
                }
              }
            } catch (e) {
              body = '⚠️ Could not parse security gate report';
            }
            
            if (body) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
      
      - name: Determine Build Status
        run: |
          EXIT_CODE=${{ steps.gate.outputs.exit_code }}
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "Security gate blocked due to policy violations"
            exit 1
          fi
          exit 0