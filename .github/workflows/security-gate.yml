name: DevSecOps Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v1
        with:
          version: latest
      
      - name: Run Security Gate
        run: python3 scripts/process-results.py policies/test_data.json
        continue-on-error: true
      
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: scan-results/
          retention-days: 30