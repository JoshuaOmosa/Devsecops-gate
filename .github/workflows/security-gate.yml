name: DevSecOps Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install OPA
        run: |
          mkdir -p ~/bin
          curl -L https://openpolicyagent.org/downloads/latest/opa_linux_x86_64 -o ~/bin/opa 2>/dev/null
          chmod +x ~/bin/opa
          echo "$HOME/bin" >> $GITHUB_PATH
      
      - name: Run Security Gate
        run: python3 scripts/process-results.py policies/test_data.json
      
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: scan-results/
          retention-days: 30