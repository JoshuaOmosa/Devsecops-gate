name: DevSecOps Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    outputs:
      gate-blocked: ${{ steps.gate.outputs.blocked }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_x86_64
          chmod +x opa
          sudo mv opa /usr/local/bin/
      
      - name: Run exploitability + SLA triage gate
        id: gate
        run: |
          python3 scripts/process-results.py policies/test_data.json
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 1 ]; then
            echo "blocked=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          exit $EXIT_CODE
        continue-on-error: false
      
      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-summary
          path: scan-results/triage-summary.json
      
      - name: Upload violation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-violations
          path: scan-results/security-gate-violations.log.json
      
      - name: Comment PR with gate decision
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const blocked = '${{ steps.gate.outputs.blocked }}' === 'true';
            const summary = JSON.parse(fs.readFileSync('scan-results/triage-summary.json', 'utf8'));
            
            const comment = blocked 
              ? `❌ **Security Gate BLOCKED**\n\n**Violations:**\n${summary.violated_policies.map(v => `- ${v}`).join('\n')}`
              : '✅ Security Gate PASSED';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if gate blocked
        if: steps.gate.outputs.blocked == 'true'
        run: |
          echo "Security gate blocked due to policy violations"
          cat scan-results/triage-summary.json
          exit 1