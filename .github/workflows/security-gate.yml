name: DevSecOps Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  # The scan the gate decides on. Point this at real scanner output
  # (normalised to the same JSON shape) to gate a real build.
  GATE_INPUT: tests/fixtures/clean_scan.json

jobs:
  policy-tests:
    name: Policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v1
        with:
          version: 1.20.2

      - name: Check Rego syntax
        run: opa check --strict policies

      - name: Run policy tests
        run: opa test policies -v

  security-gate:
    name: Security gate
    needs: policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v1
        with:
          version: 1.20.2

      # Proves the gate really blocks: the bundled fixture has an unmitigated
      # CRITICAL, so the script must exit non-zero. If it ever passes, this
      # step fails the workflow.
      - name: Gate blocks a violating scan
        run: |
          if python3 scripts/process-results.py policies/test_data.json; then
            echo "::error::Gate allowed a scan with an unmitigated CRITICAL"
            exit 1
          fi
          echo "Blocked as expected."

      # The real gate. No continue-on-error: a BLOCK decision fails the build.
      - name: Run security gate
        run: python3 scripts/process-results.py "$GATE_INPUT"

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: scan-results/
          retention-days: 30
